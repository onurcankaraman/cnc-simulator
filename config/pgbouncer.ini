[databases]
cnc = host=cnc.digitheta.dev port=5432 dbname=cnc

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = md5
auth_file = /run/secrets/sql-proxy-users
client_tls_sslmode = disable
server_tls_sslmode = verify-full
server_tls_ca_file = /etc/ssl/certs/ca-certificates.crt
pool_mode = session
default_pool_size = 2
reserve_pool_size = 0
max_db_connections = 2
max_client_conn = 20
query_timeout = 15
client_login_timeout = 10
client_idle_timeout = 300
server_connect_timeout = 10
server_idle_timeout = 60
log_connections = 0
log_disconnections = 0
