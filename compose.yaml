services:
  cnc-simulator:
    build:
      context: .
      target: runtime
    image: cnc-simulator:1.0
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${BIND_IP:-127.0.0.1}:${S7_PORT:-102}:1102"
      - "${BIND_IP:-127.0.0.1}:4840:4840"
      - "${BIND_IP:-127.0.0.1}:8080:8080"
    environment:
      DATABASE_URL: host=timescaledb dbname=cnc user=cnc_writer
      DATABASE_PASSWORD_FILE: /run/secrets/db-writer-password
      MQTT_PASSWORD_FILE: /run/secrets/mqtt-password
      ALLOW_INSECURE_OPCUA: "${ALLOW_INSECURE_OPCUA:-false}"
      ENABLE_ADMIN: "${ENABLE_ADMIN:-false}"
      ADMIN_TOKEN_FILE: /run/secrets/admin-token
      OPCUA_CERT: /run/secrets/server.der
      OPCUA_KEY: /run/secrets/server-key.der
      OPCUA_CLIENT_CERT: /run/secrets/client.der
    volumes:
      - ./secrets/db-writer-password:/run/secrets/db-writer-password:ro
      - ./config:/app/config:ro
      - ./secrets/mqtt-password:/run/secrets/mqtt-password:ro
      - ./secrets/admin-token:/run/secrets/admin-token:ro
      - ./secrets/server.der:/run/secrets/server.der:ro
      - ./secrets/server-key.der:/run/secrets/server-key.der:ro
      - ./secrets/client.der:/run/secrets/client.der:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    healthcheck:
      test: [CMD, /bin/sh, /app/container-healthcheck.sh]
      interval: 10s
      timeout: 4s
      retries: 5
    networks: [simulation]
    logging: &logging
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
  mqtt-broker:
    image: eclipse-mosquitto:2.1.2@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    user: '1883:1883'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${BIND_IP:-127.0.0.1}:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./secrets/observer-password:/run/secrets/observer-password:ro
    healthcheck:
      test: [CMD-SHELL, 'mosquitto_sub -h localhost -u observer -P "$$(cat /run/secrets/observer-password)" -t plant/demo/cnc/CNC-01/availability -C 1 -W 2 >/dev/null 2>&1; rc=$$?; [ $$rc -eq 0 ] || [ $$rc -eq 27 ]']
      interval: 10s
      timeout: 4s
      retries: 5
    networks: [simulation]
    logging: *logging
  timescaledb:
    image: timescale/timescaledb:latest-pg17@sha256:b56a3f51991df1f79d0c1a0841cad5c5fa8058fdd6a3ee6886394a6d4c174538
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: cnc
      POSTGRES_PASSWORD_FILE: /run/secrets/db-admin-password
      TIMESCALEDB_TELEMETRY: "off"
      NO_TS_TUNE: "true"
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
      - ./secrets/db-admin-password:/run/secrets/db-admin-password:ro
      - ./secrets/db-writer-password:/run/secrets/db-writer-password:ro
      - ./secrets/db-reader-password:/run/secrets/db-reader-password:ro
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=20, -c, work_mem=2MB, -c, maintenance_work_mem=16MB, -c, timescaledb.max_background_workers=4, -c, timescaledb.telemetry_level=off]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d cnc"]
      interval: 5s
      timeout: 4s
      retries: 20
    networks: [simulation]
    logging: *logging
networks:
  simulation:
    driver: bridge
volumes:
  timescale-data:
