# Optional PiriVision endpoint: proxy runs INSIDE the simulator image/container.
# Production port overrides must include 6432 explicitly, or apply this file last.
services:
  cnc-simulator:
    environment:
      ENABLE_SQL_PROXY: 'true'
    ports:
      - '${SQL_PROXY_BIND_IP:-127.0.0.1}:${SQL_PROXY_PORT:-6432}:6432'
    volumes:
      - ./secrets/sql-proxy-users:/run/secrets/sql-proxy-users:ro
